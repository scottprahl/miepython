# yamllint disable rule:truthy
---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allow manual triggering

concurrency:                       # cancel stale CI runs on the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip                       # built-in cache for wheels
          cache-dependency-path: |
            pyproject.toml

      - name: Install package (+tests)
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
          python -m pip install pytest

      # The backend is bound when miepython is first imported, so each
      # process tests only one of them.  conftest.py skips the other's files.
      - name: Run pytest with the pure python backend
        env:
          MIEPYTHON_USE_JIT: "0"
        run: python -m pytest tests

      - name: Run pytest with the numba backend
        env:
          MIEPYTHON_USE_JIT: "1"
        run: python -m pytest tests
